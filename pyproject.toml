[project]
name = "bee-guard"
version = "1.3.1"
description = "AI/ML model supply-chain security and provenance vetting CLI"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Aj7Ay", email = "ajayyegireddi007@gmail.com" },
]
keywords = ["security", "ai", "ml", "model", "supply-chain", "provenance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "rich>=13.7",
    "cryptography>=42.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "huggingface_hub>=0.20",
    "tomli>=1.2.0;python_version<'3.11'",
]

[project.urls]
Homepage = "https://github.com/Aj7Ay/BEE"
Repository = "https://github.com/Aj7Ay/BEE"
Issues = "https://github.com/Aj7Ay/BEE/issues"

[project.scripts]
bee = "bee.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bee"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
